name: Release

# Push a tag like v1.0.0 to publish a GitHub Release with the offline single-file build attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:offline
      - run: cp dist-offline/index.html "RollCall-Proxy-Editor-${GITHUB_REF_NAME}.html"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "RollCall-Proxy-Editor-${GITHUB_REF_NAME}.html" \
            --title "RollCall Proxy Editor $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
